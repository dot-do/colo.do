name = "colo-do"
main = "core/src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "b6641681fe423910342b9ffa1364c76d"
workers_dev = true

# Routes. Never a bare-star host like "*colo.workers.do/*": a route's * spans
# "/", so it also caught https://api.sb/colo.workers.do/... and
# headless.ly/x/colo.workers.do/y (fixed on the zone 2026-09-28,
# ~/projects/domains scripts/fix-workers-do-broad-routes.mjs). No
# *.colo.workers.do host serves (TLS), and that form also caught api.sb paths.
# "*colo.do/*" on the colo.do zone has the same shape; left as is.
routes = [
  { pattern = "colo.workers.do/*", zone_name = "workers.do" },
  { pattern = "*colo.do/*", zone_name = "colo.do" }
]

# Service bindings
services = [
  { binding = "CTX", service = "ctx-do", environment = "production" }
]

# Custom domain (requires DNS to be managed in Cloudflare)
# routes = [
#   { pattern = "colo.do", custom_domain = true }
# ]

# Durable Objects
[durable_objects]
bindings = [
  { name = "COLO", class_name = "ColoDO" },
  { name = "COLO_DO", class_name = "ColoDO" },
  { name = "DO_REGISTRY", class_name = "DORegistryDO" },
  { name = "COLO_SERVICE", class_name = "ColoServiceDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["ColoDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DORegistryDO"]

[[migrations]]
tag = "v3"
renamed_classes = [{ from = "Colo", to = "ColoDO" }]

[[migrations]]
tag = "v4"
new_classes = ["ColoServiceDO"]
