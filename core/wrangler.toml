name = "colo-core-test"
main = "src/worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Durable Objects for testing
[durable_objects]
bindings = [
  { name = "COLO_DO", class_name = "ColoDO" },
  { name = "DO_REGISTRY", class_name = "DORegistryDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["ColoDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["DORegistryDO"]
